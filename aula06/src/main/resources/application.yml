spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

resilience4j:
  ratelimiter:
    instances:
      alunoService:
        limitForPeriod: 1
        limitRefreshPeriod: 10s
        # 0s: a segunda chamada falha na hora e lança RequestNotPermitted (429 Too Many Requests)
        timeoutDuration: 0s
